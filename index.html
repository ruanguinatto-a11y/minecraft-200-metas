<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft • 200 Metas</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#0c1512;color:#edf9ee}*{box-sizing:border-box}body{margin:0}header{padding:26px 18px;background:linear-gradient(135deg,#193c29,#0e1a15);border-bottom:1px solid #32553e}main{max-width:780px;margin:auto;padding:20px 14px}h1{margin:0;font-size:27px}p{color:#adc5b3}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#316d46;color:white}button:hover{filter:brightness(1.13)}input{border:1px solid #46614d;border-radius:10px;background:#13221a;color:white;padding:12px;width:100%;margin:5px 0 12px}.panel{background:#17251d;border:1px solid #314b38;border-radius:18px;padding:18px;margin:14px 0}.bar{height:13px;background:#34433a;border-radius:15px;overflow:hidden}.fill{height:100%;background:#65cc75;width:0%;transition:width .2s}.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.phases button{padding:10px 2px;background:#283e30}.phases button.active{background:#4e9b5e}.goal{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #34473a;cursor:pointer}.goal input{width:22px;height:22px;margin:0;accent-color:#67ce76}.goal.done span{text-decoration:line-through;color:#8da996}.small{font-size:13px;color:#a7b9a9}.error{color:#ffb2a6}#logout{background:#45584b}#app{display:none}@media(min-width:600px){.phases{grid-template-columns:repeat(10,1fr)}} </style></head><body><header><div style="max-width:780px;margin:auto"><h1>⛏️ Minecraft — 200 Metas</h1><p>20 fases · Survival · Progresso salvo na nuvem</p></div></header><main><section id="auth" class="panel"><h2>Entrar ou criar conta</h2><p>Use seu e-mail e senha para salvar as metas no Supabase.</p><input id="email" type="email" placeholder="Seu e-mail" autocomplete="email"><input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password"><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="login">Entrar</button><button id="signup">Criar conta</button></div><p id="authmsg" class="small"></p></section><section id="app"><div class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong id="counter">0 / 200 metas</strong><button id="logout">Sair</button></div><p id="status" class="small">Carregando...</p><div class="bar"><div class="fill" id="fill"></div></div></div><div class="panel"><h3>Escolha a fase</h3><div class="phases" id="phases"></div></div><div class="panel"><h2 id="phaseTitle"></h2><div id="goals"></div><div style="display:flex;justify-content:space-between;margin-top:15px"><button id="prev">← Anterior</button><button id="next">Próxima →</button></div></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const db=createClient('https://illvkokjqhbypwqyyvsj.supabase.co','sb_publishable_dj6siJgB-jgoaWrePcgC6w_gmGFz_yT');
const phases=[{"name":"Primeiro dia","goals":["Coletar 32 madeiras","Fazer bancada de trabalho","Criar ferramentas de pedra","Coletar 32 pedras","Conseguir 16 alimentos","Construir abrigo provisório","Fazer uma fornalha","Conseguir 3 lãs e fazer cama","Criar um baú","Sobreviver à primeira noite"]},{"name":"Idade do ferro","goals":["Explorar uma caverna","Coletar 32 ferros brutos","Fabricar escudo","Criar picareta de ferro","Criar espada de ferro","Fazer armadura completa de ferro","Fabricar balde de água","Criar tesoura","Fazer um mapa","Explorar os arredores da base"]},{"name":"Lar definitivo","goals":["Escolher terreno para a base","Construir casa principal","Fazer depósito organizado","Criar cozinha decorada","Montar quarto","Iluminar toda a propriedade","Construir caminho de entrada","Criar estábulo","Fazer mural de mapas","Construir torre de observação"]},{"name":"Alimentação e animais","goals":["Plantar trigo","Plantar cenoura","Plantar batata","Criar curral de vacas","Criar curral de ovelhas","Criar galinheiro","Domesticar um lobo","Domesticar um gato","Criar plantação de cana","Fazer reserva de 3 stacks de comida"]},{"name":"A busca dos diamantes","goals":["Explorar caverna profunda","Encontrar primeiros diamantes","Fabricar picareta de diamante","Coletar obsidiana","Criar mesa de encantamentos","Conseguir 15 estantes","Encantar picareta","Criar armadura de diamante","Fabricar espada de diamante","Organizar mina principal"]},{"name":"O mundo exterior","goals":["Encontrar uma vila","Proteger os aldeões","Explorar templo do deserto","Encontrar navio naufragado","Seguir mapa de tesouro","Explorar posto de saqueadores","Encontrar bioma de cerejeiras","Encontrar selva","Coletar bambu e cacau","Criar mapa de exploração"]},{"name":"Comércio e redstone","goals":["Transportar dois aldeões","Criar criador de aldeões","Fazer salão de trocas","Conseguir bibliotecário","Conseguir Remendo","Conseguir Fortuna III","Conseguir Eficiência V","Criar mecanismo com pistões","Construir porta automática","Montar sistema simples de armazenamento"]},{"name":"Portal do Nether","goals":["Construir portal decorado","Preparar armadura de ouro","Entrar no Nether","Encontrar floresta carmesim","Encontrar floresta distorcida","Coletar quartzo","Coletar glowstone","Encontrar fortaleza do Nether","Coletar 12 varas de blaze","Voltar vivo com os recursos"]},{"name":"Segredos do Nether","goals":["Encontrar bastião","Coletar ouro para trocas","Negociar com piglins","Conseguir pérolas de Ender","Coletar areia das almas","Coletar fungos do Nether","Conseguir fungo distorcido","Explorar delta de basalto","Encontrar detritos ancestrais","Criar primeiro equipamento de netherita"]},{"name":"Alquimia e preparação","goals":["Construir laboratório","Fabricar suporte de poções","Criar poção de resistência ao fogo","Criar poção de cura","Criar poção de força","Criar poção de queda lenta","Encantar arco","Preparar 2 stacks de flechas","Fabricar 16 olhos de Ender","Montar kit para o End"]},{"name":"A fortaleza","goals":["Seguir olhos de Ender","Encontrar stronghold","Explorar biblioteca da fortaleza","Coletar livros e tesouros","Encontrar sala do portal","Criar abrigo próximo","Guardar equipamentos reservas","Preparar cama e baú de emergência","Ativar portal do End","Entrar no End"]},{"name":"O dragão","goals":["Proteger ponto de chegada","Destruir cristais do End","Sobreviver aos ataques do dragão","Derrotar Ender Dragon","Coletar experiência","Pegar ovo do dragão","Atravessar portal para ilhas externas","Encontrar End City","Conseguir elytra","Conseguir 8 cascos de shulker"]},{"name":"O poder do voo","goals":["Fabricar caixas de shulker","Encantar elytra com Remendo","Criar farm de cana automática","Criar farm de pólvora","Fabricar 3 stacks de foguetes","Construir plataforma de decolagem","Explorar 5 mil blocos voando","Encontrar outra End City","Conseguir elytra reserva","Criar sala de equipamentos de voo"]},{"name":"Revolução das farms","goals":["Criar farm de ferro","Criar farm de XP","Criar farm de bambu","Criar farm de mel","Criar farm de lã","Criar farm de abóbora","Criar farm de melancia","Criar farm de kelp","Criar farm de mobs hostis","Construir centro de coleta das farms"]},{"name":"Conquistador","goals":["Encontrar mansão da floresta","Derrotar evocadores","Conseguir Totem da Imortalidade","Explorar monumento oceânico","Derrotar três guardiões anciões","Encontrar Ancient City","Evitar ou escapar do Warden","Conseguir bússola de recuperação","Explorar câmara de desafios","Conquistar uma câmara sinistra"]},{"name":"O Wither","goals":["Coletar três crânios de esqueleto Wither","Coletar quatro areias das almas","Preparar arena segura","Invocar Wither","Derrotar Wither","Conseguir estrela do Nether","Fabricar beacon","Construir pirâmide para beacon","Ativar efeito de pressa","Criar sala de troféus dos chefões"]},{"name":"A cidade","goals":["Planejar ruas da cidade","Construir prefeitura","Construir 5 casas","Criar mercado central","Construir biblioteca","Construir ferreiro","Construir estábulos","Construir muralhas","Criar iluminação pública","Povoar a cidade com aldeões"]},{"name":"Mestre construtor","goals":["Construir castelo","Criar porto com barcos","Construir ponte monumental","Criar jardim botânico","Construir aquário gigante","Criar estátua personalizada","Construir ferrovia longa","Criar base subterrânea","Construir base no céu","Fazer museu de blocos"]},{"name":"Domínio do mundo","goals":["Criar rede de portais do Nether","Conectar três bases distantes","Construir estrada de gelo no Nether","Criar sistema de classificação de itens","Conseguir conjunto completo de netherita","Encantar ferramentas principais ao máximo","Criar coleção de discos musicais","Colecionar todos os tipos de madeira","Criar zoológico de mobs","Construir mapa gigante do território"]},{"name":"O império final","goals":["Criar megabase principal","Construir farm avançada de XP","Construir farm de ouro","Construir farm de Enderman","Criar armazenamento para milhões de itens","Construir projeto gigante no End","Construir fortaleza no Nether","Criar monumento de todas as aventuras","Derrotar o dragão novamente","Fazer tour completo do mundo e celebrar 200 metas"]}];
let user=null,phase=0,done=new Set(),busy=new Set();
const el=id=>document.getElementById(id),msg=(s)=>el('status').textContent=s;
function render(){el('counter').textContent=done.size+' / 200 metas ('+Math.round(done.size/2)+'%)';el('fill').style.width=done.size/2+'%';el('phases').innerHTML='';phases.forEach((p,i)=>{const b=document.createElement('button');b.className=i===phase?'active':'';b.textContent=(i+1)+' · '+p.goals.filter((_,j)=>done.has(i*10+j+1)).length+'/10';b.onclick=()=>{phase=i;render()};el('phases').append(b)});el('phaseTitle').textContent='Fase '+(phase+1)+' — '+phases[phase].name;el('goals').innerHTML='';phases[phase].goals.forEach((title,j)=>{const id=phase*10+j+1;const label=document.createElement('label');label.className='goal'+(done.has(id)?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=done.has(id);check.disabled=busy.has(id);const span=document.createElement('span');span.textContent=title;label.append(check,span);check.onchange=()=>save(id,check.checked);el('goals').append(label)});el('prev').disabled=phase===0;el('next').disabled=phase===19}
async function save(id,value){busy.add(id);msg('Salvando...');render();let result=await db.from('minecraft_progress').upsert({user_id:user.id,goal_id:id,done:value,updated_at:new Date().toISOString()},{onConflict:'user_id,goal_id'});busy.delete(id);if(result.error){msg('Erro ao salvar: '+result.error.message);render();return}value?done.add(id):done.delete(id);msg('✓ Progresso salvo na nuvem');render()}
async function start(session){user=session?.user||null;el('auth').style.display=user?'none':'block';el('app').style.display=user?'block':'none';if(!user)return;msg('Carregando progresso...');const {data,error}=await db.from('minecraft_progress').select('goal_id,done').eq('user_id',user.id);if(error){msg('Erro ao carregar: '+error.message);return}done=new Set((data||[]).filter(x=>x.done).map(x=>x.goal_id));msg('✓ Conectado e sincronizado');render()}
async function auth(signup){el('authmsg').textContent='Aguarde...';const email=el('email').value.trim(),password=el('password').value;if(!email||password.length<6){el('authmsg').textContent='Informe e-mail e senha com pelo menos 6 caracteres.';return}const {data,error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});el('authmsg').textContent=error?error.message:signup&&!data.session?'Conta criada. Confirme seu e-mail antes de entrar.':'Conectado.';if(data.session)await start(data.session)}
el('login').onclick=()=>auth(false);el('signup').onclick=()=>auth(true);el('logout').onclick=async()=>{await db.auth.signOut();done.clear();await start(null)};el('prev').onclick=()=>{phase=Math.max(0,phase-1);render()};el('next').onclick=()=>{phase=Math.min(19,phase+1);render()};db.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>start(session),0)});const {data:{session}}=await db.auth.getSession();await start(session);
</script></body></html>
